<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<!-- Fonts load without blocking the first paint; display=swap shows the fallback meanwhile. -->
		<link
			rel="preload"
			as="style"
			href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Mukta:wght@300;400;500;600;700;800&family=Baloo+2:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
		/>
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Mukta:wght@300;400;500;600;700;800&family=Baloo+2:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
			media="print"
			onload="this.media = 'all'"
		/>
		<noscript>
			<link
				rel="stylesheet"
				href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Mukta:wght@300;400;500;600;700;800&family=Baloo+2:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
			/>
		</noscript>
		<link
			rel="alternate"
			type="application/rss+xml"
			href="/rss.xml"
			title="Popup Bits blog (RSS)"
		/>
		<link rel="alternate" type="text/plain" href="/llms.txt" title="llms.txt" />
		<link rel="alternate" type="application/json" href="/apps.json" title="App catalogue (JSON)" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
